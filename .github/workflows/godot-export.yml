name: Godot Export

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6.1"
  GODOT_STATUS: "stable"
  PROJECT_DIR: "godot"
  EXPORT_NAME: "MandateCities"

jobs:
  windows-exe:
    name: Windows EXE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" -o godot.zip
          curl -L "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" -o templates.tpz
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          unzip -q templates.tpz
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          cp -R templates/* "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"

      - name: Export Windows build
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          mkdir -p "${PROJECT_DIR}/export/windows"
          "./Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" --headless --path "${PROJECT_DIR}" --export-release "Windows Desktop" "export/windows/${EXPORT_NAME}-${SHORT_SHA}.exe"

      # After the export the project is imported, so headless tools can run: unresolved
      # content references and the reviewed gameplay rules fail the build.
      - name: Content and rules checks
        shell: bash
        run: |
          set -euo pipefail
          GODOT="./Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          "$GODOT" --headless --path "${PROJECT_DIR}" res://tools/content_check.tscn
          "$GODOT" --headless --path "${PROJECT_DIR}" res://tools/rules_smoke.tscn
          "$GODOT" --headless --fixed-fps 60 --path "${PROJECT_DIR}" res://tools/save_roundtrip.tscn
          "$GODOT" --headless --fixed-fps 60 --path "${PROJECT_DIR}" res://tools/run_state_smoke.tscn
          "$GODOT" --headless --fixed-fps 60 --path "${PROJECT_DIR}" --quit-after 400000 res://tools/fuzz_smoke.tscn -- seed=1

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.EXPORT_NAME }}-windows-${{ github.sha }}"
          path: "${{ env.PROJECT_DIR }}/export/windows/*.exe"
          if-no-files-found: error

  # The Windows build was exported on Linux and, for months, never started by anyone. This
  # job starts the exported .exe on a real Windows machine: it must boot, read its own
  # pack, pass the content and rules checks, and walk the whole campaign with the building
  # bot. Headless (the runner has no GPU), so it says nothing about rendering. An export
  # template takes no scene path on the command line: `-- selftest=<tool>` makes the game
  # hand over to the tool's scene itself (ContentDB.boot_selftest).
  windows-run:
    name: Windows run check
    needs: windows-exe
    runs-on: windows-latest
    steps:
      - name: Download the exported build
        uses: actions/download-artifact@v4
        with:
          name: "${{ env.EXPORT_NAME }}-windows-${{ github.sha }}"
          path: build

      - name: Run the exported game
        shell: pwsh
        run: |
          $exe = (Get-ChildItem build -Filter *.exe | Select-Object -First 1).FullName
          Write-Host "exe: $exe ($([math]::Round((Get-Item $exe).Length / 1MB)) MB)"
          $runs = @(
            @{ name = "content_check"; args = @("--", "selftest=content_check") },
            @{ name = "rules_smoke"; args = @("--", "selftest=rules_smoke") },
            @{ name = "campaign_smoke"; args = @("--fixed-fps", "60", "--quit-after", "2000000", "--", "selftest=campaign_smoke") }
          )
          $bad = 0
          foreach ($r in $runs) {
            $log = Join-Path $PWD "$($r.name).log"
            $p = Start-Process -FilePath $exe -ArgumentList (@("--headless", "--log-file", $log) + $r.args) -Wait -PassThru
            Write-Host "== $($r.name): exit $($p.ExitCode)"
            if (Test-Path $log) {
              Get-Content $log -Encoding UTF8 | Select-String -Pattern "^=== |^FAIL|SCRIPT ERROR|^дорога" | Select-Object -Last 12 | ForEach-Object { Write-Host $_.Line }
            } else {
              Write-Host "no log written"
              $bad++
            }
            if ($p.ExitCode -ne 0) { $bad++ }
          }
          if ($bad -gt 0) { exit 1 }

  # The run check above is headless. This one opens the game's window on Windows and saves
  # one picture per screen (tools/ui_shots), so somebody has seen what the Windows build
  # draws before a tester does. The runner has no graphics card: the game falls back from
  # OpenGL to ANGLE over Direct3D's software adapter, which is slower than any real PC but
  # draws the same frames. Does not hold a release back: a hosted runner's display is not
  # a player's machine, and the pictures are for a person to look at.
  windows-picture:
    name: Windows picture check
    needs: windows-exe
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Download the exported build
        uses: actions/download-artifact@v4
        with:
          name: "${{ env.EXPORT_NAME }}-windows-${{ github.sha }}"
          path: build

      - name: Open the game and take the pictures
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "display size left as is: $_" }
          $exe = (Get-ChildItem build -Filter *.exe | Select-Object -First 1).FullName
          $out = Join-Path $PWD "shots"
          New-Item -ItemType Directory -Force $out | Out-Null
          $code = 1
          foreach ($driver in @("", "opengl3_angle")) {
            $log = Join-Path $PWD "ui_shots_$($driver -replace '^$', 'default').log"
            $a = @("--log-file", $log, "--resolution", "1280x720")
            if ($driver) { $a += @("--rendering-driver", $driver) }
            $a += @("--", "selftest=ui_shots", "out=$($out -replace '\\', '/')")
            $p = Start-Process -FilePath $exe -ArgumentList $a -PassThru
            if (-not $p.WaitForExit(600000)) { $p.Kill(); Write-Host "== stopped after ten minutes" }
            $shots = @(Get-ChildItem $out -Filter *.png).Count
            Write-Host "== driver '$driver': exit $($p.ExitCode), pictures $shots"
            if (Test-Path $log) {
              Get-Content $log -Encoding UTF8 | Select-String -Pattern "^OpenGL|^Vulkan|^D3D|ANGLE|ERROR|^=== |^FAIL|^UI SHOTS" | Select-Object -First 30 | ForEach-Object { Write-Host $_.Line }
            }
            if ($shots -gt 0) { $code = $p.ExitCode; break }
          }
          exit $code

      - name: Upload the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "windows-pictures-${{ github.sha }}"
          path: |
            shots/*.png
            *.log
          if-no-files-found: warn

  macos-dmg:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_macos.universal.zip" -o godot.zip
          curl -L "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" -o templates.tpz
          unzip -q godot.zip
          chmod +x Godot.app/Contents/MacOS/Godot
          unzip -q templates.tpz
          mkdir -p "${HOME}/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          cp -R templates/* "${HOME}/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"

      - name: Export macOS app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${PROJECT_DIR}/export/macos"
          Godot.app/Contents/MacOS/Godot --headless --path "${PROJECT_DIR}" --export-release "macOS" "export/macos/${EXPORT_NAME}.zip"

      - name: Package DMG
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          rm -rf "${PROJECT_DIR}/export/macos/app"
          mkdir -p "${PROJECT_DIR}/export/macos/app"
          unzip -q "${PROJECT_DIR}/export/macos/${EXPORT_NAME}.zip" -d "${PROJECT_DIR}/export/macos/app"
          hdiutil create -volname "Mandate Cities" -srcfolder "${PROJECT_DIR}/export/macos/app" -ov -format UDZO "${PROJECT_DIR}/export/macos/${EXPORT_NAME}-${SHORT_SHA}.dmg"

      # The same start-up check as on Windows, with the app that goes into the DMG.
      - name: Run the exported app
        shell: bash
        run: |
          set -euo pipefail
          APP_BIN="$(find "${PROJECT_DIR}/export/macos/app" -path '*Contents/MacOS/*' -type f | head -1)"
          echo "binary: ${APP_BIN}"
          "$APP_BIN" --headless -- selftest=content_check | grep -E "^=== |^FAIL|SCRIPT ERROR"
          "$APP_BIN" --headless -- selftest=rules_smoke | grep -E "^=== |^FAIL|SCRIPT ERROR"
          "$APP_BIN" --headless --fixed-fps 60 --quit-after 2000000 -- selftest=campaign_smoke | grep -E "^=== CAMPAIGN|^FAIL|SCRIPT ERROR|^дорога"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.EXPORT_NAME }}-macos-${{ github.sha }}"
          path: "${{ env.PROJECT_DIR }}/export/macos/*.dmg"
          if-no-files-found: error

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" -o godot.zip
          curl -L "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" -o templates.tpz
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          unzip -q templates.tpz
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          cp -R templates/* "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"

      # The runner image ships the Android SDK and JDK 17; Godot only has to be told where
      # they are (editor settings) and what to sign with. With no keystore in the repo
      # secrets the build is signed with a throwaway key, so testers uninstall the previous
      # build before installing a new one. To keep one signature across builds, add the
      # secrets ANDROID_KEYSTORE_BASE64 (a keystore with alias "mandate") and
      # ANDROID_KEYSTORE_PASSWORD.
      - name: Point Godot at the Android SDK and a keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.0" >/dev/null
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "${PWD}/release.keystore"
            PASSWORD="${KEYSTORE_PASSWORD}"
          else
            PASSWORD="android"
            keytool -genkeypair -keystore "${PWD}/release.keystore" -alias mandate -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASSWORD" -keypass "$PASSWORD" -dname "CN=Mandate Cities, O=Gaefa, C=RU"
          fi
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=${PWD}/release.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=mandate"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=${PASSWORD}"
          } >> "$GITHUB_ENV"
          mkdir -p "${HOME}/.config/godot"
          SETTINGS="${HOME}/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres"
          printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]' \
            "export/android/java_sdk_path = \"${JAVA_HOME_17_X64}\"" \
            "export/android/android_sdk_path = \"${ANDROID_HOME}\"" > "$SETTINGS"
          cat "$SETTINGS"

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          mkdir -p "${PROJECT_DIR}/export/android"
          "./Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" --headless --path "${PROJECT_DIR}" --export-release "Android" "export/android/${EXPORT_NAME}-${SHORT_SHA}.apk"
          test -s "${PROJECT_DIR}/export/android/${EXPORT_NAME}-${SHORT_SHA}.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.EXPORT_NAME }}-android-${{ github.sha }}"
          path: "${{ env.PROJECT_DIR }}/export/android/*.apk"
          if-no-files-found: error

      # The same project built for x86_64, for the emulator job below: CI runners are x86 and
      # the shipped APK is arm64 only. Kept under another extension so the release job's
      # *.apk pattern never picks it up.
      - name: Export an x86_64 build for the emulator check
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's|architectures/x86_64=false|architectures/x86_64=true|; s|architectures/arm64-v8a=true|architectures/arm64-v8a=false|' "${PROJECT_DIR}/export_presets.cfg"
          mkdir -p "${PROJECT_DIR}/export/android-emu"
          "./Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" --headless --path "${PROJECT_DIR}" --export-release "Android" "export/android-emu/emulator.apk"
          mv "${PROJECT_DIR}/export/android-emu/emulator.apk" "${PROJECT_DIR}/export/android-emu/emulator-build.bin"
          git checkout -- "${PROJECT_DIR}/export_presets.cfg"

      - name: Upload the emulator build
        uses: actions/upload-artifact@v4
        with:
          name: "emulator-build-${{ github.sha }}"
          path: "${{ env.PROJECT_DIR }}/export/android-emu/emulator-build.bin"
          if-no-files-found: error
          retention-days: 3

  # Nobody has started the Android build on a device. This job starts an x86_64 build of the
  # same project in an emulator, waits for the title screen, checks the process is alive and
  # no fatal exception was logged, presses Android's Back and checks the game is still in front,
  # and keeps five screenshots at a phone's resolution. It runs in its own job, without
  # the signing secrets, and does not block a release: an emulator with software rendering
  # is a weaker witness than a phone, and a flaky one.
  android-run:
    name: Android run check (emulator)
    needs: android-apk
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Download the emulator build
        uses: actions/download-artifact@v4
        with:
          name: "emulator-build-${{ github.sha }}"
          path: build

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the game in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          # swangle (ANGLE over SwiftShader's Vulkan), not swiftshader_indirect: the plain
          # SwiftShader GLES translator cannot link Godot's canvas shader (it counts uniform
          # blocks against GL_MAX_FRAGMENT_UNIFORM_VECTORS) and the screen stays grey.
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            mv build/emulator-build.bin build/emulator.apk
            adb install -r build/emulator.apk
            adb logcat -c
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb shell monkey -p com.mandatecities.pixelcitybuilder -c android.intent.category.LAUNCHER 1
            sleep 60
            adb exec-out screencap -p > android_1_title.png
            # Two taps on a 2400x1080 landscape screen: "New game", then "Begin" on the mandate
            # screen (the interface is the 1280x720 design at 1.5, centred). If the layout
            # moves, the later shots show the wrong screen: this is a look, not a test.
            adb shell wm size
            adb shell input tap 1200 697
            sleep 6
            adb exec-out screencap -p > android_2_mandate.png
            adb shell input tap 1627 742
            sleep 20
            adb exec-out screencap -p > android_3_game.png
            # Android's own Back and a finger drag, through the system's input: Back must leave
            # the game running and in front (before 0.4.5 it closed it on the spot).
            adb shell input keyevent KEYCODE_BACK
            sleep 4
            adb exec-out screencap -p > android_4_back.png
            adb shell pidof com.mandatecities.pixelcitybuilder
            adb shell dumpsys activity activities | grep -i "resumedactivity" | grep com.mandatecities.pixelcitybuilder
            adb shell input keyevent KEYCODE_BACK
            sleep 2
            adb shell input swipe 1300 600 900 400 600
            sleep 2
            adb exec-out screencap -p > android_5_drag.png
            adb logcat -d -s godot:V GodotEngine:V AndroidRuntime:E | grep -v "^$" | grep -E "OpenGL API|ERROR|FATAL|Godot Engine" | sort | uniq -c | sort -rn | head -15
            adb shell pidof com.mandatecities.pixelcitybuilder
            if adb logcat -d -s AndroidRuntime:E | grep -q "FATAL EXCEPTION"; then echo "fatal exception in the log"; exit 1; fi

      - name: Upload the title screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "android-title-${{ github.sha }}"
          path: android_*.png
          if-no-files-found: warn
          retention-days: 7

  # A pushed tag v* (e.g. v0.1.1) publishes the builds plus the tester guides as a
  # GitHub Release, so testers get one link instead of a 240 MB file share.
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-exe, windows-run, macos-dmg, android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release
          cp dist/*/*.exe "release/${EXPORT_NAME}-${TAG}.exe"
          cp dist/*/*.dmg "release/${EXPORT_NAME}-${TAG}.dmg"
          cp dist/*/*.apk "release/${EXPORT_NAME}-${TAG}.apk"
          for f in docs/PLAYER_GUIDE.md docs/PLAYER_GUIDE_EN.md docs/README_TESTERS.txt; do
            [ -f "$f" ] && cp "$f" release/
          done
          ls -la release

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES="docs/README_TESTERS.txt"
          [ -f "$NOTES" ] || NOTES=""
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" --title "Mandate Cities ${TAG#v} — playtest build" ${NOTES:+--notes-file "$NOTES"} release/*
          fi

