name: Godot Export

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6.1"
  GODOT_STATUS: "stable"
  PROJECT_DIR: "godot"
  EXPORT_NAME: "MandateCities"

jobs:
  windows-exe:
    name: Windows EXE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" -o godot.zip
          curl -L "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" -o templates.tpz
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          unzip -q templates.tpz
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          cp -R templates/* "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"

      - name: Export Windows build
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          mkdir -p "${PROJECT_DIR}/export/windows"
          "./Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" --headless --path "${PROJECT_DIR}" --export-release "Windows Desktop" "export/windows/${EXPORT_NAME}-${SHORT_SHA}.exe"

      # After the export the project is imported, so headless tools can run: unresolved
      # content references and the reviewed gameplay rules fail the build.
      - name: Content and rules checks
        shell: bash
        run: |
          set -euo pipefail
          GODOT="./Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          "$GODOT" --headless --path "${PROJECT_DIR}" res://tools/content_check.tscn
          "$GODOT" --headless --path "${PROJECT_DIR}" res://tools/rules_smoke.tscn
          "$GODOT" --headless --fixed-fps 60 --path "${PROJECT_DIR}" res://tools/save_roundtrip.tscn
          "$GODOT" --headless --fixed-fps 60 --path "${PROJECT_DIR}" res://tools/run_state_smoke.tscn
          "$GODOT" --headless --fixed-fps 60 --path "${PROJECT_DIR}" --quit-after 400000 res://tools/fuzz_smoke.tscn -- seed=1

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.EXPORT_NAME }}-windows-${{ github.sha }}"
          path: "${{ env.PROJECT_DIR }}/export/windows/*.exe"
          if-no-files-found: error

  macos-dmg:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_macos.universal.zip" -o godot.zip
          curl -L "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" -o templates.tpz
          unzip -q godot.zip
          chmod +x Godot.app/Contents/MacOS/Godot
          unzip -q templates.tpz
          mkdir -p "${HOME}/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          cp -R templates/* "${HOME}/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"

      - name: Export macOS app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${PROJECT_DIR}/export/macos"
          Godot.app/Contents/MacOS/Godot --headless --path "${PROJECT_DIR}" --export-release "macOS" "export/macos/${EXPORT_NAME}.zip"

      - name: Package DMG
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          rm -rf "${PROJECT_DIR}/export/macos/app"
          mkdir -p "${PROJECT_DIR}/export/macos/app"
          unzip -q "${PROJECT_DIR}/export/macos/${EXPORT_NAME}.zip" -d "${PROJECT_DIR}/export/macos/app"
          hdiutil create -volname "Mandate Cities" -srcfolder "${PROJECT_DIR}/export/macos/app" -ov -format UDZO "${PROJECT_DIR}/export/macos/${EXPORT_NAME}-${SHORT_SHA}.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.EXPORT_NAME }}-macos-${{ github.sha }}"
          path: "${{ env.PROJECT_DIR }}/export/macos/*.dmg"
          if-no-files-found: error

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" -o godot.zip
          curl -L "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" -o templates.tpz
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          unzip -q templates.tpz
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          cp -R templates/* "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"

      # The runner image ships the Android SDK and JDK 17; Godot only has to be told where
      # they are (editor settings) and what to sign with. With no keystore in the repo
      # secrets the build is signed with a throwaway key, so testers uninstall the previous
      # build before installing a new one. To keep one signature across builds, add the
      # secrets ANDROID_KEYSTORE_BASE64 (a keystore with alias "mandate") and
      # ANDROID_KEYSTORE_PASSWORD.
      - name: Point Godot at the Android SDK and a keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.0" >/dev/null
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "${PWD}/release.keystore"
            PASSWORD="${KEYSTORE_PASSWORD}"
          else
            PASSWORD="android"
            keytool -genkeypair -keystore "${PWD}/release.keystore" -alias mandate -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASSWORD" -keypass "$PASSWORD" -dname "CN=Mandate Cities, O=Gaefa, C=RU"
          fi
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=${PWD}/release.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=mandate"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=${PASSWORD}"
          } >> "$GITHUB_ENV"
          mkdir -p "${HOME}/.config/godot"
          SETTINGS="${HOME}/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres"
          printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]' \
            "export/android/java_sdk_path = \"${JAVA_HOME_17_X64}\"" \
            "export/android/android_sdk_path = \"${ANDROID_HOME}\"" > "$SETTINGS"
          cat "$SETTINGS"

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          mkdir -p "${PROJECT_DIR}/export/android"
          "./Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" --headless --path "${PROJECT_DIR}" --export-release "Android" "export/android/${EXPORT_NAME}-${SHORT_SHA}.apk"
          test -s "${PROJECT_DIR}/export/android/${EXPORT_NAME}-${SHORT_SHA}.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.EXPORT_NAME }}-android-${{ github.sha }}"
          path: "${{ env.PROJECT_DIR }}/export/android/*.apk"
          if-no-files-found: error

  # A pushed tag v* (e.g. v0.1.1) publishes the builds plus the tester guides as a
  # GitHub Release, so testers get one link instead of a 240 MB file share.
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-exe, macos-dmg, android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release
          cp dist/*/*.exe "release/${EXPORT_NAME}-${TAG}.exe"
          cp dist/*/*.dmg "release/${EXPORT_NAME}-${TAG}.dmg"
          cp dist/*/*.apk "release/${EXPORT_NAME}-${TAG}.apk"
          for f in docs/PLAYER_GUIDE.md docs/PLAYER_GUIDE_EN.md docs/README_TESTERS.txt; do
            [ -f "$f" ] && cp "$f" release/
          done
          ls -la release

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES="docs/README_TESTERS.txt"
          [ -f "$NOTES" ] || NOTES=""
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" --title "Mandate Cities ${TAG#v} — playtest build" ${NOTES:+--notes-file "$NOTES"} release/*
          fi

